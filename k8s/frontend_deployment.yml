kind: Deployment
apiVersion: apps/v1
metadata:
  name: frontend-deployment
  namespace: exam
  labels:
    app: app
spec:
  replicas: 3
  selector:
    matchLabels:
      app: app
  template:
    metadata:
      labels:
        app: app
    spec:
      containers:
      - name: front-cont
        image: swayamnakshane/front1:latest
        ports:
          - containerPort: 3000
